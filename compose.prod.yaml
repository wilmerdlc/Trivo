services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: PostgreSQL
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - PostgresDb:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: PgAdmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - PgAdmin:/var/lib/pgadmin
    networks:
      - backend

  seq:
    image: datalust/seq:2025.2
    container_name: SEQ
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${SEQ_ACCEPT_EULA}
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "${SEQ_PORT_INGESTION}:5341"
      - "${SEQ_PORT_UI}:80"
    volumes:
      - Seq:/data
    networks:
      - backend

  redis:
    image: redis:8.6.2-alpine
    container_name: Redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - Redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
      - redis

  api:
    image: ${API_IMAGE}
    container_name: TrivoAPI
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5026
      ConnectionStrings__TrivoContext: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"

      JwtSetting__Key: ${JWT_KEY}
      JwtSetting__Issuer: ${JWT_ISSUER}
      JwtSetting__Audience: ${JWT_AUDIENCE}
      JwtSetting__DurationInMinutes: ${JWT_DURATION_IN_MINUTES}

      EmailSetting__EmailFrom: ${EMAIL_FROM}
      EmailSetting__SmtpHost: ${EMAIL_SMTP_HOST}
      EmailSetting__SmtpPort: ${EMAIL_SMTP_PORT}
      EmailSetting__SmtpUser: ${EMAIL_SMTP_USER}
      EmailSetting__SmtpPassword: ${EMAIL_SMTP_PASSWORD}
      EmailSetting__DisplayName: ${EMAIL_DISPLAY_NAME}

      CloudinarySetting__CloudinaryUrl: ${CLOUDINARY_URL}

      AiSetting__EmbeddingModel: ${AI_EMBEDDING_MODEL}
      AiSetting__ApiKey: ${AI_API_KEY}

      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN}
    ports:
      - "${API_PORT}:5026"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5026/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - redis

volumes:
  PostgresDb:
    driver: local
  PgAdmin:
    driver: local
  Seq:
    driver: local
  Redis:
    driver: local

networks:
  backend:
    driver: bridge
  redis:
    driver: bridge
